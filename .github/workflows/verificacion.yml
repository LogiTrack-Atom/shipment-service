name: Verificación de shipment-service

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Preparar Java 25 y caché Maven
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verificar protecciones del publicador Sprint04
        run: python3 -m unittest discover -s scripts/release/tests -p test_publish_sprint04.py -v
      - name: Validar contratos de asignación asíncrona
        run: |
          python3 -m venv /tmp/logitrack-contracts
          /tmp/logitrack-contracts/bin/pip install --disable-pip-version-check -r scripts/contracts/requirements.txt
          /tmp/logitrack-contracts/bin/python -m unittest discover -s scripts/contracts/tests -v
      - name: Ejecutar pruebas y generar Javadoc
        run: ./mvnw -B -ntp verify javadoc:javadoc
