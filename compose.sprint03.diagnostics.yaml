# Diagnóstico optativo en loopback. MySQL no publica puertos.
services:
  configserver:
    ports:
      - 127.0.0.1:${CONFIG_SERVER_HOST_PORT:-8085}:8085
  eureka-server:
    ports:
      - 127.0.0.1:${EUREKA_HOST_PORT:-8065}:8065
  security-service:
    ports:
      - 127.0.0.1:${SECURITY_HOST_PORT:-8082}:8082
  courier-service:
    ports:
      - 127.0.0.1:${COURIER_HOST_PORT:-8081}:8081
  shipment-service:
    ports:
      - 127.0.0.1:${SHIPMENT_HOST_PORT:-8080}:8080
