# Topología y hashes de credenciales exclusivamente en un archivo externo privado.
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/definitions.json
definitions.skip_if_unchanged = true
vm_memory_high_watermark.absolute = 384MiB
disk_free_limit.absolute = 1GiB
listeners.tcp.default = 5672
management.tcp.port = 15672
# Mantener la protección del usuario guest aunque no se cree al importar definiciones.
loopback_users.guest = true
