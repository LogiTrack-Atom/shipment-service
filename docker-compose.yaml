# Entrega: imágenes existentes, sin build. Completar .env fuera de Git.
name: ${COMPOSE_PROJECT_NAME:-logitrack-sprint02}
services:
  shipment-mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: shipment_db
      MYSQL_USER: shipment_app
      MYSQL_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      MYSQL_ROOT_PASSWORD: ${SHIPMENT_DB_ROOT_PASSWORD:?Definir contraseña administrativa fuera de Git}
      TZ: UTC
    volumes:
    - shipment_mysql_data:/var/lib/mysql
    - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --batch --skip-column-names --execute="SELECT 1 FROM envios LIMIT 0" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    networks:
    - logitrack-net
  courier-mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: courier_db
      MYSQL_USER: courier_app
      MYSQL_PASSWORD: ${COURIER_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      MYSQL_ROOT_PASSWORD: ${COURIER_DB_ROOT_PASSWORD:?Definir contraseña administrativa fuera de Git}
      TZ: UTC
    volumes:
    - courier_mysql_data:/var/lib/mysql
    - ./docker/mysql/courier:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --batch --skip-column-names --execute="SELECT 1 FROM repartidores LIMIT 0" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    networks:
    - logitrack-net
  security-mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_DATABASE: security_db
      MYSQL_USER: security_app
      MYSQL_PASSWORD: ${SECURITY_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      MYSQL_ROOT_PASSWORD: ${SECURITY_DB_ROOT_PASSWORD:?Definir contraseña administrativa fuera de Git}
      TZ: UTC
    volumes:
    - security_mysql_data:/var/lib/mysql
    - ./docker/mysql/security:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
        --batch --skip-column-names --execute="SELECT 1 FROM usuarios LIMIT 0" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
    networks:
    - logitrack-net
  configserver:
    image: ${CONFIGSERVER_IMAGE:?Definir imagen de Config Server con etiqueta explícita}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      CONFIG_GIT_URI: https://github.com/LogiTrack-Atom/configserver-ms.git
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=10
    ports:
    - 127.0.0.1:${CONFIG_SERVER_HOST_PORT:-8085}:8085
    networks:
    - logitrack-net
  security-service:
    image: ${SECURITY_IMAGE:?Definir imagen con etiqueta explícita}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      configserver:
        condition: service_healthy
      security-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://configserver:8085
      CONFIG_LABEL: ${CONFIG_LABEL:?Fijar un commit o etiqueta de configuraciones}
      DB_URL: jdbc:mysql://security-mysql:3306/security_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: security_app
      DB_PASSWORD: ${SECURITY_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/public.pem
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=10
      JWT_PRIVATE_KEY_LOCATION: file:/run/keys/private.pem
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
    - type: bind
      source: ${JWT_PUBLIC_KEY_FILE:?Definir archivo público externo}
      target: /run/keys/public.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${JWT_PRIVATE_KEY_FILE:?Definir archivo privado externo solo para security}
      target: /run/keys/private.pem
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${SECURITY_HOST_PORT:-8082}:8082
    networks:
    - logitrack-net
    group_add:
    - ${KEYS_GID:?Definir grupo con lectura de claves externas}
  courier-service:
    image: ${COURIER_IMAGE:?Definir imagen con etiqueta explícita}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      configserver:
        condition: service_healthy
      courier-mysql:
        condition: service_healthy
      security-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://configserver:8085
      CONFIG_LABEL: ${CONFIG_LABEL:?Fijar un commit o etiqueta de configuraciones}
      DB_URL: jdbc:mysql://courier-mysql:3306/courier_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: courier_app
      DB_PASSWORD: ${COURIER_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/public.pem
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=10
      SECURITY_SERVICE_URL: http://security-service:8082
    volumes:
    - type: bind
      source: ${JWT_PUBLIC_KEY_FILE:?Definir archivo público externo}
      target: /run/keys/public.pem
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${COURIER_HOST_PORT:-8081}:8081
    networks:
    - logitrack-net
    group_add:
    - ${KEYS_GID:?Definir grupo con lectura de claves externas}
  shipment-service:
    image: ${SHIPMENT_IMAGE:?Definir imagen con etiqueta explícita}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      configserver:
        condition: service_healthy
      shipment-mysql:
        condition: service_healthy
      security-service:
        condition: service_healthy
      courier-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CONFIG_SERVER_URL: http://configserver:8085
      CONFIG_LABEL: ${CONFIG_LABEL:?Fijar un commit o etiqueta de configuraciones}
      DB_URL: jdbc:mysql://shipment-mysql:3306/shipment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: shipment_app
      DB_PASSWORD: ${SHIPMENT_DB_PASSWORD:?Definir contraseña de aplicación fuera de Git}
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/public.pem
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=10
      SECURITY_SERVICE_URL: http://security-service:8082
      COURIER_SERVICE_URL: http://courier-service:8081
    volumes:
    - type: bind
      source: ${JWT_PUBLIC_KEY_FILE:?Definir archivo público externo}
      target: /run/keys/public.pem
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${SHIPMENT_HOST_PORT:-8080}:8080
    networks:
    - logitrack-net
    group_add:
    - ${KEYS_GID:?Definir grupo con lectura de claves externas}
volumes:
  shipment_mysql_data: null
  courier_mysql_data: null
  security_mysql_data: null
networks:
  logitrack-net: null
